<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#0B5C99" rx="100" />
  
  <g fill="#ffffff" transform="translate(0, 50)">
    <!-- Top Arrow -->
    <path d="M 120 120 C 170 60, 250 40, 340 70 C 370 80, 390 100, 390 100 L 370 120 L 440 140 L 430 70 L 410 90 C 410 90, 370 50, 310 30 C 210 0, 120 40, 80 100 Z" />
    
    <!-- Speed Lines -->
    <path d="M 270 90 L 280 110 L 275 110 Z" />
    <path d="M 310 110 L 330 130 L 320 135 Z" />
    <path d="M 240 100 L 245 110 L 240 110 Z" />

    <!-- Bottom Arrow -->
    <path d="M 380 280 C 330 340, 250 360, 160 330 C 130 320, 110 300, 110 300 L 130 280 L 60 260 L 70 330 L 90 310 C 90 310, 130 350, 190 370 C 290 400, 380 360, 420 300 Z" />
    
    <!-- Car Silhouette -->
    <!-- Front/Hood -->
    <path d="M 100 210 C 90 190, 130 180, 160 170 C 210 120, 280 140, 330 170 C 380 180, 420 190, 420 230 C 420 250, 380 250, 380 250 L 320 250 L 320 250 C 300 250, 290 230, 270 230 C 250 230, 240 250, 220 250 L 160 250 C 140 250, 130 230, 110 230 C 90 230, 90 250, 70 250 C 70 250, 60 250, 60 230 C 60 210, 90 210, 100 210 Z" />
    
    <!-- Headlight/Details cutout -->
    <path d="M 340 190 C 370 190, 400 200, 400 210 C 370 210, 340 200, 340 190 Z" fill="#0B5C99" />
    <path d="M 120 195 L 150 190 L 150 200 Z" fill="#0B5C99" />

    <!-- Wheels (Outline since background is solid) -->
    <circle cx="270" cy="245" r="22" fill="#ffffff" stroke="#0B5C99" stroke-width="4" />
    <circle cx="110" cy="245" r="22" fill="#ffffff" stroke="#0B5C99" stroke-width="4" />

    <!-- Inner Wheel hubs -->
    <circle cx="270" cy="245" r="10" fill="#0B5C99" />
    <circle cx="110" cy="245" r="10" fill="#0B5C99" />

    <!-- Text -->
    <text x="250" y="380" font-family="'Arial Black', Impact, sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="1">ATLAS CHRONO CARS</text>
  </g>
</svg>
